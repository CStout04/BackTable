<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sprinter</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="/CSCI 4250 Project/images/Sprinter Bucky.png">
</head>
<body>

  <!-- Main Menu Screen -->
  <div id="menu">
    
    <!-- ETSU Logo -->
    <img src="images/etsu-logo.png" alt="ETSU Logo" id="etsuLogo">

    <h1>Sprinter</h1>

    <div class="controls" id="controls">
      <p><strong>Controls:</strong></p>
      <p class="subtitle">Tap / Space / Up Arrow to jump • Swipe down / Down Arrow / Shift to duck</p>
    </div>

    <div class="difficulty-group">
      <label for="difficultySelect"><strong>Select Difficulty:</strong></label>
      <select id="difficultySelect" name="difficulty">
        <option value="normal">Normal</option>
      </select>
    </div>

    <p class="start-text" id="startText">Press SPACE or UP ARROW to Start</p>
  </div>

  <!-- Game screen (hidden until game starts) -->
 <main id="gameScreen" style="display: none; position: relative;">
    <h2>
      Sprinter
    </h2>

      <!-- Background layer -->
  <div id="background">
    <h2>
      Sprinter
    </h2>
  </div>
    <img src="images/Sprinter Bucky.png" alt="Sprinter Bucky" id="Bucky">
  </main>

  <script src="js/game_start.js"></script>
</body>
</html>

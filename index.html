<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sprinter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Main Menu -->
  <div id="menu">
    <h1>Sprinter</h1>

    <p class="start-text">Press SPACE to Start</p>

    <div class="controls">
      <p><strong>Controls:</strong></p>
      <p>Jump: SPACE / ↑</p>
      <p>(Crouch: ↓ / Shift)</p>
    </div>

    <div class="difficulty">
      <p><strong>Select Difficulty:</strong></p>
      <ul id="difficultyList">
        <li class="selected">Easy - Slower speed, fewer obstacles</li>
        <li>Hard - Faster speed, more obstacles</li>
      </ul>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
